<!DOCTYPE html>
<html lang="en">

<head>
    <!-- external CSS link -->
    <link rel="stylesheet" href="css/construction.css">
</head>

<body>
    <div class="app">
        <h1>USGS Flood Data Monitor</h1>
        <p>Check real-time flood reference points and vulnerable infrastructure by date.</p>

        <div class="controls">
            <label for="dateInput">Select Date:</label>
            <input type="date" id="dateInput" name="">
            <button type="button" name="button">Enter</button>
        </div>

        <p class="loading" id="loadingText">Searching records...</p>
        <div id="resultContainer"></div>
    </div>

    <script type="text/javascript" src="js/construction.js"></script>
</body>

</html>
